<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0f;--side:#111112;--pn:#181819;--pn2:#1e1e20;--ln:#262628;--tx:#ececee;--mu:#85858b;--ac:#f2a93b;--ac2:#f7c26b;--ok:#6ee7a0;--ease:cubic-bezier(.2,.7,.2,1);
--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--hd:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f3ef;--side:#ecebe6;--pn:#fff;--pn2:#f6f5f1;--ln:#dedcd5;--tx:#18181a;--mu:#76767c;--ac:#c77d0a;--ac2:#a96500;color-scheme:light}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a2a2d 0,var(--bg) 60%);color:var(--tx);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
:root[data-theme="light"] body{background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid #6ea8f5;outline-offset:2px}
.app{display:grid;grid-template-columns:272px 1fr;height:100%;background:var(--bg)}
@media(min-width:1100px){.app{height:calc(100% - 48px);margin:24px;border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px #0008}}
aside{background:var(--side);border-right:1px solid var(--ln);display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:22px 22px 14px;font:600 21px var(--hd);letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.acct{margin:0 16px 14px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--pn);display:flex;align-items:center;gap:8px}
.acct input{flex:1;min-width:0;background:none;border:0;outline:0;font:13px var(--mono)}
.acct span{font:13px var(--mono);color:var(--mu)}
.acct button{color:var(--ac);font:500 12px var(--mono);padding:2px 4px}
#cmp{margin:0 16px 10px;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--ac);color:#17110a;border-radius:999px;padding:11px;font-weight:600;transition:transform .3s var(--ease),filter .3s}
#cmp:hover{transform:translateY(-1px);filter:brightness(1.08)}#cmp:active{transform:scale(.97)}
.sec{padding:16px 22px 6px;font:12px var(--mono);color:var(--mu);letter-spacing:.04em;text-transform:uppercase}
nav{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#c9c9ce;border:1px solid transparent;width:100%;text-align:left;transition:background .25s,color .25s}
:root[data-theme="light"] .nv{color:#3a3a3f}
.nv svg{color:var(--mu)}.nv em{margin-left:auto;font:13px var(--mono);color:var(--mu);font-style:normal}
.nv:hover{background:#ffffff0a}.nv.on{background:linear-gradient(#242426,#1d1d1f);border-color:#2f2f32;color:#fff}
:root[data-theme="light"] .nv.on{background:#fff;border-color:var(--ln);color:#000}
.nv.on svg{color:var(--ac)}
.tg i{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent);transition:.2s}
.tg[aria-pressed="false"]{color:#6c6c72}.tg[aria-pressed="false"] i{background:transparent;box-shadow:none;border:1.5px solid currentColor}
.side-f{margin-top:auto;padding:16px 22px;font:12px var(--mono);color:var(--mu);display:flex;gap:8px;align-items:center}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #6ee7a066}100%{box-shadow:0 0 0 8px #6ee7a000}}
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--ln);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);z-index:3}
.sb{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;padding:9px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--pn);color:var(--mu);transition:border-color .3s}
.sb:focus-within{border-color:#3d3d41}.sb input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx)}
kbd{font:11px var(--mono);background:#262628;border-radius:5px;padding:3px 6px;color:#b9b9be}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--mu);transition:.2s}.ib:hover{background:#ffffff0f;color:var(--tx)}
.ib.spin svg{animation:spin .7s var(--ease)}@keyframes spin{to{transform:rotate(360deg)}}
#mn,#bk{display:none}
.head{display:flex;align-items:center;gap:12px;padding:22px 24px 12px}
h1{font:600 34px var(--hd);letter-spacing:-.02em}h1 span{color:#6c6c72;font-weight:500}
.head .sp{flex:1}
.bulk{display:flex;gap:2px;opacity:0;pointer-events:none;transition:opacity .25s}.bulk.on{opacity:1;pointer-events:auto}
#ls{flex:1;overflow:auto;padding:0 12px 24px}
.row{display:flex;align-items:center;gap:12px;padding:0 12px;height:56px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .25s,border-color .25s;position:relative}
.row.in{animation:rowin .55s var(--ease) backwards;animation-delay:calc(var(--i)*45ms)}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}}
.row:hover{background:var(--pn);border-color:var(--ln)}.row.ck{background:var(--pn2);border-color:var(--ln)}
.row.new{animation:fresh 1.6s var(--ease)}@keyframes fresh{0%{background:#f2a93b33;transform:translateX(-14px);opacity:0}30%{opacity:1;transform:none}100%{background:transparent}}
.av{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font:600 13px var(--mono);color:#fff;flex:none}
.fr{width:170px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9c9ce}
:root[data-theme="light"] .fr{color:#333}
.sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sn span{color:var(--mu)}
.row.un .fr,.row.un .sn b{color:var(--tx);font-weight:600}.row.un:before{content:"";position:absolute;left:-1px;top:18px;width:4px;height:20px;border-radius:2px;background:var(--ac)}
.cd{font:500 12px var(--mono);color:var(--ac2);border:1px solid #f2a93b55;background:#f2a93b14;border-radius:999px;padding:2px 9px;flex:none;transition:.2s}.cd:hover{background:#f2a93b33}
.dt{font:12px var(--mono);color:var(--mu);width:50px;text-align:right;flex:none}
.stz{color:var(--mu);width:22px;display:grid;place-items:center;transition:transform .3s var(--ease)}.stz:hover{transform:scale(1.2)}.stz.on{color:var(--ac)}.stz.on svg{fill:currentColor}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--ac);flex:none}
.empty{color:var(--mu);text-align:center;padding:80px 20px;font:13px var(--mono)}
#rd{display:none;flex:1;overflow:auto;padding:8px 24px 30px}
.card{max-width:820px;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:26px 28px;animation:fadeup .5s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
.card h2{font:600 26px/1.2 var(--hd);letter-spacing:-.01em;margin-bottom:20px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--ln)}
.who small{display:block;font:12px var(--mono);color:var(--mu)}
.otp{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid #f2a93b55;background:linear-gradient(160deg,#f2a93b1f,#f2a93b08);border-radius:12px;padding:16px 20px;margin-bottom:22px}
.otp b{font:500 34px var(--mono);letter-spacing:.14em;color:var(--ac2)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;background:var(--ac);color:#17110a;transition:transform .3s var(--ease),filter .3s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.96)}
.btn.gh{background:var(--pn2);color:var(--tx);border:1px solid var(--ln)}
.body{white-space:pre-wrap;line-height:1.7}.acts{display:flex;gap:10px;margin-top:28px}
#cp{position:fixed;right:28px;bottom:0;width:500px;max-width:100%;background:var(--pn);border:1px solid #333;border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -10px 50px #000a;display:none;flex-direction:column;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);transform-origin:bottom right}
#cp.show{animation:pop .4s var(--ease)}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
#cp .t{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font:500 13px var(--mono);color:var(--mu);border-bottom:1px solid var(--ln)}
#cp input,#cp textarea{background:none;border:0;border-bottom:1px solid var(--ln);padding:11px 16px;outline:0;width:100%}
#cp textarea{height:230px;resize:none;border:0}#cp .f{padding:12px 16px;display:flex;align-items:center;gap:12px}
.msg{font:12px var(--mono);color:var(--mu)}
#ts{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--pn2);border:1px solid #3a3a3d;border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.4s var(--ease);z-index:50;display:flex;gap:10px;align-items:center}
#ts.on{opacity:1;transform:translate(-50%,0)}#ts i{width:8px;height:8px;border-radius:50%;background:var(--ac)}
#sc{display:none;position:fixed;inset:0;background:#000a;z-index:9}
@media(max-width:820px){
.app{grid-template-columns:1fr}
aside{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:10;transform:translateX(-100%);transition:transform .4s var(--ease)}
aside.open{transform:none}body.dr #sc{display:block}
#mn{display:grid}.top{padding:10px 12px}.head{padding:16px 16px 8px}h1{font-size:28px}#ls{padding:0 6px 20px}
.fr{width:96px}.stz,.row input,.cd,.dt{display:none}.row.un .dt{display:block}.dt{display:block;width:44px}
#rd{padding:6px 12px 24px}.card{padding:20px}#cp{right:0;width:100%}kbd{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
<aside id="sd">
<div class="brand"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="#f2a93b" stroke-width="2"/><circle cx="13" cy="13" r="5" fill="#f2a93b"/></svg>Halo</div>
<div class="acct"><input id="loc" placeholder="pseudo" aria-label="Pseudo"><span>@y.w80.it</span><button id="go">OUVRIR</button></div>
<button id="cmp"></button>
<div class="sec">Dossiers</div>
<nav id="fn"></nav>
<div class="sec">Catégories</div>
<nav id="tgs"></nav>
<div class="side-f"><i class="live"></i><span id="st">hors ligne</span></div>
</aside>
<main>
<div class="top">
<button class="ib" id="mn" aria-label="Menu"></button>
<label class="sb"><span id="si"></span><input id="q" placeholder="Rechercher" aria-label="Recherche"><kbd>/</kbd></label>
<span style="flex:1"></span>
<button class="ib" id="rf" aria-label="Actualiser"></button><button class="ib" id="th" aria-label="Thème"></button>
</div>
<div class="head"><button class="ib" id="bk" aria-label="Retour"></button><h1 id="h1"></h1><span class="sp"></span>
<div class="bulk" id="bulk"><button class="ib" id="mr" aria-label="Marquer comme lu"></button><button class="ib" id="dl" aria-label="Supprimer"></button></div></div>
<div id="ls"></div><div id="rd"></div>
</main></div>
<div id="sc"></div><div id="ts"><i></i><span id="tt"></span></div>
<div id="cp"><div class="t"><span>NOUVEAU MESSAGE</span><button id="cx" class="ib" style="width:26px;height:26px">✕</button></div>
<input id="to" placeholder="À"><input id="sj" placeholder="Objet"><textarea id="bd" placeholder="Écrivez votre message…"></textarea>
<div class="f"><button class="btn" id="snd">Envoyer</button><span class="msg" id="cm"></span></div></div>
<script>
// URL du Worker (voir worker.js) pour recevoir de vrais mails. Vide = mode démo.
var API="";
var S={addr:"",mails:[],live:[],f:"in",sel:null,ck:{},read:[],star:[],trash:[],sent:[],local:[],off:[],anim:true,fresh:null,timer:false};
var $=function(i){return document.getElementById(i)};
var P={inbox:"M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5",star:"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z",send:"M21 3L10 14M21 3l-7 18-4-7-7-4z",trash:"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13",search:"M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4",refresh:"M20 11a8 8 0 00-14-4L4 9M4 4v5h5M4 13a8 8 0 0014 4l2-2M20 20v-5h-5",edit:"M4 20h4L19 9l-4-4L4 16zM13 7l4 4",back:"M15 5l-7 7 7 7",reply:"M10 8L4 13l6 5v-3c5 0 8 1 10 5-1-6-4-10-10-10z",fwd:"M14 8l6 5-6 5v-3c-5 0-8 1-10 5 1-6 4-10 10-10z",copy:"M9 9h10v11H9zM5 15V4h10",menu:"M4 7h16M4 12h16M4 17h16",moon:"M20 14A8 8 0 1110 4a6 6 0 0010 10z",check:"M4 12l5 5L20 6"};
function ic(n){return'<svg class="i" viewBox="0 0 24 24"><path d="'+P[n]+'"/></svg>'}
var FOLD=[["in","inbox","Réception"],["star","star","Suivis"],["sent","send","Envoyés"],["trash","trash","Corbeille"]];
var TAGS=[{n:"Codes",c:"#f2a93b"},{n:"Newsletters",c:"#6ea8f5"},{n:"Autres",c:"#6ee7a0"}];
function ls(){try{return window.localStorage}catch(e){return null}}
function load(){try{var d=JSON.parse(ls().getItem("halo")||"{}");for(var k in d)S[k]=d[k]}catch(e){}}
function save(){try{ls().setItem("halo",JSON.stringify({addr:S.addr,read:S.read,star:S.star,trash:S.trash,sent:S.sent,local:S.local,off:S.off}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nm(f){return f.split("<")[0].trim()||f}
function mail(f){return(f.match(/<(.+)>/)||[0,f])[1]}
function col(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return"hsl("+h+",42%,38%)"}
function ini(s){return(s.trim()[0]||"?").toUpperCase()}
function fmt(t){var d=new Date(t),n=new Date();return d.toDateString()==n.toDateString()?d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function code(m){var t=m.subj+" "+m.body;if(!/code|v[ée]rif|otp|confirm/i.test(t))return null;var r=t.match(/\b\d{3} ?\d{3}\b|\b\d{4,8}\b/);return r?r[0].replace(/ /g,""):null}
function tag(m){if(code(m))return 0;return/news|lettre|promo|nouveaut/i.test(m.subj+m.from)?1:2}
function toast(s){$("tt").textContent=s;$("ts").classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){$("ts").classList.remove("on")},2200)}
function demo(a){var t=Date.now();return[
{id:"d1",from:"Équipe Halo <bienvenue@halo.app>",subj:"Bienvenue sur "+a,date:t-60000,body:"Bonjour,\n\nVotre boîte "+a+" est prête.\n\nN’importe quelle adresse @y.w80.it fonctionne : saisissez un pseudo à gauche et cliquez sur Ouvrir.\n\nEssayez « Nouveau message » en vous écrivant à vous-même.\n\nCeci est un message de démonstration."},
{id:"d2",from:"Service Démo <noreply@exemple.com>",subj:"Votre code de vérification : 482 913",date:t-3600000,body:"Votre code de vérification est 482913.\nIl expire dans 10 minutes.\n\nSi vous n’êtes pas à l’origine de cette demande, ignorez ce message."},
{id:"d3",from:"Newsletter <news@exemple.org>",subj:"Les nouveautés de la semaine",date:t-86400000,body:"Bonjour,\n\nVoici les nouveautés de la semaine.\n\nBonne lecture !"}].concat(S.live)}
async function fetchMails(){
if(!S.addr)return render();
if(!API){S.mails=demo(S.addr);$("st").textContent="démo · aucun serveur relié";
if(!S.timer){S.timer=true;setTimeout(function(){var m={id:"d4",from:"Boutique Démo <no-reply@boutique.fr>",subj:"Confirmez votre inscription : code 7391",date:Date.now(),body:"Merci de votre inscription.\nVotre code de confirmation : 7391"};S.live.push(m);S.mails=demo(S.addr);S.fresh="d4";S.anim=false;toast("Nouveau message reçu");render()},9000)}}
else{try{var r=await fetch(API+"/api/inbox?addr="+encodeURIComponent(S.addr));S.mails=await r.json();$("st").textContent="en ligne · "+new Date().toLocaleTimeString("fr-FR")}catch(e){$("st").textContent="serveur injoignable"}}
S.anim=true;render()}
function every(){return S.mails.concat(S.local)}
function inbox(){return every().filter(function(m){return S.trash.indexOf(m.id)<0})}
function view(){var f=S.f,a;
if(f=="sent")a=S.sent.filter(function(m){return S.trash.indexOf(m.id)<0});
else if(f=="trash")a=every().concat(S.sent).filter(function(m){return S.trash.indexOf(m.id)>-1});
else{a=inbox();if(f=="star")a=a.filter(function(m){return S.star.indexOf(m.id)>-1});a=a.filter(function(m){return S.off.indexOf(tag(m))<0})}
var q=$("q").value.toLowerCase();
return a.filter(function(m){return(m.subj+m.from+(m.to||"")+m.body).toLowerCase().indexOf(q)>-1}).sort(function(x,y){return y.date-x.date})}
function unread(){return inbox().filter(function(m){return S.read.indexOf(m.id)<0}).length}
function chrome(){
var n={in:unread(),star:inbox().filter(function(m){return S.star.indexOf(m.id)>-1}).length,sent:S.sent.length,trash:S.trash.length};
$("fn").innerHTML=FOLD.map(function(x){return'<button class="nv'+(S.f==x[0]?" on":"")+'" data-f="'+x[0]+'">'+ic(x[1])+x[2]+'<em>'+(n[x[0]]||"")+'</em></button>'}).join("");
$("tgs").innerHTML=TAGS.map(function(t,i){return'<button class="nv tg" data-t="'+i+'" aria-pressed="'+(S.off.indexOf(i)<0)+'" style="color:'+t.c+'"><i></i><span style="color:var(--tx)">'+t.n+'</span></button>'}).join("");
document.title=(n.in?"("+n.in+") ":"")+"Halo"}
function render(){chrome();
var m=every().concat(S.sent).filter(function(x){return x.id==S.sel})[0];
$("ls").style.display=m?"none":"block";$("rd").style.display=m?"block":"none";$("bk").style.display=m?"grid":"none";
$("h1").innerHTML=m?"":FOLD.filter(function(x){return x[0]==S.f})[0][2]+" <span>"+view().length+"</span>";
var k=Object.keys(S.ck).filter(function(i){return S.ck[i]}).length;$("bulk").classList.toggle("on",k>0||!!m);
if(m){var sent=S.sent.indexOf(m)>-1,c=code(m);
$("rd").innerHTML='<div class="card"><h2>'+esc(m.subj||"(sans objet)")+'</h2><div class="who"><div class="av" style="background:'+col(m.from)+'">'+ini(nm(m.from))+'</div><div><b>'+esc(nm(m.from))+'</b><small>'+esc(mail(m.from))+' → '+esc(sent?m.to:S.addr)+' · '+new Date(m.date).toLocaleString("fr-FR")+'</small></div></div>'+(c?'<div class="otp"><b>'+esc(c)+'</b><button class="btn" data-cp="'+esc(c)+'">'+ic("copy")+'Copier le code</button></div>':"")+'<div class="body">'+esc(m.body)+'</div><div class="acts"><button class="btn gh" data-a="re">'+ic("reply")+'Répondre</button><button class="btn gh" data-a="fw">'+ic("fwd")+'Transférer</button></div></div>';S.anim=false;return}
var l=view(),sv=S.f=="sent";
$("ls").innerHTML=l.map(function(m,i){var u=!sv&&S.read.indexOf(m.id)<0,c=code(m),s=S.star.indexOf(m.id)>-1;
return'<div class="row'+(u?" un":"")+(S.ck[m.id]?" ck":"")+(S.anim?" in":"")+(S.fresh==m.id?" new":"")+'" style="--i:'+Math.min(i,12)+'" data-id="'+esc(m.id)+'"><input type="checkbox" '+(S.ck[m.id]?"checked":"")+' data-c="1" aria-label="Sélectionner"><button class="stz'+(s?" on":"")+'" data-s="1" aria-label="Suivre">'+ic("star")+'</button><div class="av" style="background:'+col(m.from)+'">'+ini(sv?m.to:nm(m.from))+'</div><span class="fr">'+esc(sv?m.to:nm(m.from))+'</span><span class="sn"><b>'+esc(m.subj||"(sans objet)")+'</b> <span>— '+esc(m.body.replace(/\s+/g," ").slice(0,90))+'</span></span>'+(c&&u?'<button class="cd" data-cp="'+esc(c)+'">'+esc(c)+'</button>':"")+'<span class="dt">'+fmt(m.date)+'</span></div>'}).join("")||'<div class="empty">'+(S.addr?"— aucun message —":"saisissez un pseudo pour ouvrir une boîte")+'</div>';
S.anim=false;S.fresh=null}
function cpy(c){try{navigator.clipboard.writeText(c).then(function(){toast("Code copié")},function(){toast(c)})}catch(e){toast(c)}}
$("ls").onclick=function(e){var b=e.target.closest("[data-cp]");if(b){e.stopPropagation();return cpy(b.dataset.cp)}
var r=e.target.closest(".row");if(!r)return;var id=r.dataset.id;
if(e.target.dataset.c){S.ck[id]=e.target.checked;return render()}
if(e.target.closest("[data-s]")){var i=S.star.indexOf(id);i>-1?S.star.splice(i,1):S.star.push(id);save();return render()}
S.sel=id;if(S.read.indexOf(id)<0)S.read.push(id);save();render()};
$("rd").onclick=function(e){var c=e.target.closest("[data-cp]");if(c)return cpy(c.dataset.cp);var a=e.target.closest("[data-a]");if(!a)return;
var m=every().concat(S.sent).filter(function(x){return x.id==S.sel})[0];
if(a.dataset.a=="re")comp(mail(m.from),"Re: "+m.subj,"\n\n— "+nm(m.from)+" a écrit :\n"+m.body.replace(/^/gm,"> "));
else comp("","Tr: "+m.subj,"\n\n---------- Message transféré ----------\n"+m.body)};
$("bk").onclick=function(){S.sel=null;S.anim=true;render()};
function sel(){var k=Object.keys(S.ck).filter(function(i){return S.ck[i]});if(!k.length&&S.sel)k=[S.sel];return k}
$("dl").onclick=function(){sel().forEach(function(i){var x=S.trash.indexOf(i);S.f=="trash"?(x>-1&&S.trash.splice(x,1)):(x<0&&S.trash.push(i))});S.ck={};S.sel=null;save();toast(S.f=="trash"?"Restauré":"Placé dans la corbeille");render()};
$("mr").onclick=function(){sel().forEach(function(i){if(S.read.indexOf(i)<0)S.read.push(i)});S.ck={};S.sel=null;save();render()};
$("sd").onclick=function(e){var d=e.target.closest(".nv");if(!d)return;
if(d.dataset.t!==undefined){var t=+d.dataset.t,i=S.off.indexOf(t);i>-1?S.off.splice(i,1):S.off.push(t);save();S.anim=true;return render()}
S.f=d.dataset.f;S.sel=null;S.ck={};S.anim=true;closeD();render()};
function closeD(){document.body.classList.remove("dr");$("sd").classList.remove("open")}
$("mn").onclick=function(){document.body.classList.toggle("dr");$("sd").classList.toggle("open")};$("sc").onclick=closeD;
function comp(to,sj,bd){$("to").value=to||"";$("sj").value=sj||"";$("bd").value=bd||"";$("cm").textContent="";var c=$("cp");c.style.display="flex";c.classList.remove("show");void c.offsetWidth;c.classList.add("show");closeD()}
$("cmp").onclick=function(){comp()};$("cx").onclick=function(){$("cp").style.display="none"};
$("snd").onclick=function(){var to=$("to").value.trim();if(!to){$("cm").textContent="destinataire requis";return}
var m={id:"s"+Date.now(),from:S.addr||"moi",to:to,subj:$("sj").value,body:$("bd").value,date:Date.now()};S.sent.push(m);
if(S.addr&&to.toLowerCase()==S.addr){var l={id:"l"+Date.now(),from:nm(S.addr)+" <"+S.addr+">",subj:m.subj,body:m.body,date:Date.now()};S.local.push(l);S.fresh=l.id}
save();$("cp").style.display="none";toast("Message envoyé");render()};
function open_(){var v=$("loc").value.trim().toLowerCase().replace(/@.*/,"").replace(/[^a-z0-9._+-]/g,"");if(!v)return;S.addr=v+"@y.w80.it";S.sel=null;S.f="in";save();fetchMails();closeD()}
$("go").onclick=open_;$("loc").onkeydown=function(e){if(e.key=="Enter")open_()};
$("q").oninput=function(){S.anim=false;render()};
$("rf").onclick=function(){var b=this;b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");fetchMails()};
$("th").onclick=function(){var r=document.documentElement;r.dataset.theme=r.dataset.theme=="light"?"dark":"light"};
document.addEventListener("keydown",function(e){if(e.key=="/"&&document.activeElement.tagName!="INPUT"&&document.activeElement.tagName!="TEXTAREA"){e.preventDefault();$("q").focus()}if(e.key=="Escape"){S.sel=null;$("cp").style.display="none";render()}});
$("cmp").innerHTML=ic("edit")+"Nouveau message";$("mn").innerHTML=ic("menu");$("si").innerHTML=ic("search");$("rf").innerHTML=ic("refresh");$("th").innerHTML=ic("moon");$("bk").innerHTML=ic("back");$("mr").innerHTML=ic("check");$("dl").innerHTML=ic("trash");
load();if(S.addr){$("loc").value=S.addr.split("@")[0];fetchMails()}else render();
setInterval(function(){if(API&&S.addr&&!S.sel){S.anim=false;fetchMails()}},15000);
</script></body></html>
